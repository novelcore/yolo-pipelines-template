[project]
name = "model-quantization"
version = "0.1.0"
description = "Shared quantization export tail — PTQ (yolo) and QAT passthrough to INT8 TFLite."
authors = [
    { name = "Example Org", email = "dev@example.org" }
]
readme = "README.md"

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<=3.14"
pydantic = "^2.11.5"
typer = "^0.16.0"
ultralytics = ">=8.2"
mlflow = ">=3.0,<4"
# MLflow auth: the `zitadel` request-auth provider ships with kaos-lib[mlflow], the package the Dockerfile installs.
pyyaml = ">=6.0"
numpy = ">=1.24"
pillow = ">=10.0"
ai-edge-litert = ">=1.0"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
types-pyyaml = ">=6.0"

[tool.poetry.scripts]
model-quantization = "app.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
