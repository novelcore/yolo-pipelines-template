project: PLACEHOLDER-project
app: PLACEHOLDER-app
pipelineName: PLACEHOLDER-pipeline
namespace: PLACEHOLDER-namespace
registryUrl: registry.internal.invalid
imageRepo: PLACEHOLDER-imagerepo
lakefs:
  endpoint: http://lakefs.internal.invalid
  repository: PLACEHOLDER-repo
  # externalUrl is the public ingress (PRD-1016 F-08): off-cluster runs
  # (MeluXina Slurm jobs) reach lakeFS here with a Zitadel bearer.
  externalUrl: https://lakefs.internal.invalid
  adminSecret: PLACEHOLDER-lakefs-admin
  adminSecretKeys:
    accessKey: accessKeyId
    secretKey: secretAccessKey
mlflow:
  trackingUri: http://mlflow.internal.invalid
  # externalUrl is the public ingress (PRD-1016 F-08): off-cluster runs
  # (MeluXina Slurm jobs) reach MLflow here with a Zitadel bearer.
  externalUrl: https://mlflow.internal.invalid
  svcSecret: PLACEHOLDER-mlflow-svc
  oidcDomain: oidc.internal.invalid
  oidcProjectId: PLACEHOLDER-oidc-project-id
computeClasses:
  cpu:
    name: cpu-standard
    tier: cpu
    machineType: n2-standard-8
    tolerationKey: platform.kubecore.io/ml-workload
    tolerationValue: cpu
    maxNodeCount: 4
    diskSizeGb: 50
    description: "n2-standard-8 (8 vCPU, 32 GiB) \u2014 CPU pipeline steps (headroom\
      \ for model-quantization + heavier CPU steps; scale-from-0 so cost only during\
      \ a step)"
    allocatable:
      cpu: 7
      memoryGiB: 26
  gpu:
    name: gpu-t4
    tier: gpu
    machineType: n1-standard-8
    tolerationKey: platform.kubecore.io/ml-workload
    tolerationValue: gpu
    maxNodeCount: 1
    diskSizeGb: 100
    description: "n1-standard-8 + 1x T4 \u2014 YOLO training + qat-finetune (8 vCPU\
      \ so qat cpu:4 request fits under allocatable; scale-from-0)"
    guestAccelerator:
      type: nvidia-tesla-t4
      count: 1
    allocatable:
      cpu: 6
      memoryGiB: 22
  all:
  - name: cpu-standard
    tier: cpu
    machineType: n2-standard-8
    description: "n2-standard-8 (8 vCPU, 32 GiB) \u2014 CPU pipeline steps (headroom\
      \ for model-quantization + heavier CPU steps; scale-from-0 so cost only during\
      \ a step)"
    allocatable:
      cpu: 7
      memoryGiB: 26
  - name: gpu-t4
    tier: gpu
    machineType: n1-standard-8
    description: "n1-standard-8 + 1x T4 \u2014 YOLO training + qat-finetune (8 vCPU\
      \ so qat cpu:4 request fits under allocatable; scale-from-0)"
    guestAccelerator:
      type: nvidia-tesla-t4
      count: 1
    allocatable:
      cpu: 6
      memoryGiB: 22
hpc:
  enabled: true
  provider: meluxina
checkpoints:
  bucket: PLACEHOLDER-bucket
  prefix: main/checkpoints
serviceAccountName: argo-workflow
