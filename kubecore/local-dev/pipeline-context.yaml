# LOCAL-DEV pipeline-context: PLACEHOLDER values only.
#
# This file exists only so `python -m kubecore.enhance` can be exercised on your
# own machine. On the platform the real pipeline-context is generated for your
# project and used when your pipeline is built; this copy is never read there.
#
# Never put real endpoints, secret names or sign-in ids in this file (or any
# file of your repository). Keep every value below a non-functional placeholder.
project: PLACEHOLDER-project
app: PLACEHOLDER-app
pipelineName: PLACEHOLDER-pipeline
namespace: PLACEHOLDER-namespace
registryUrl: registry.internal.invalid
imageRepo: PLACEHOLDER-imagerepo
lakefs:
  endpoint: http://lakefs.internal.invalid
  repository: PLACEHOLDER-repo
  # externalUrl is the address you open in a browser or reach from kaosctl;
  # the render step writes it into your repository's .kubecore/dataset-config.yaml.
  externalUrl: "https://lakefs.internal.invalid"
  adminSecret: PLACEHOLDER-lakefs-admin
  adminSecretKeys:
    accessKey: accessKeyId
    secretKey: secretAccessKey
mlflow:
  trackingUri: http://mlflow.internal.invalid
  # externalUrl is the public address: steps that run on HPC (Slurm) reach
  # MLflow here with a bearer token.
  externalUrl: "https://mlflow.internal.invalid"
  svcSecret: PLACEHOLDER-mlflow-svc
  oidcDomain: "oidc.internal.invalid"
  oidcProjectId: "PLACEHOLDER-oidc-project-id"
# computeClasses.{cpu,gpu} are the two compute classes of your project's
# machines. The render step routes each step to the gpu class if it needs a
# GPU, else to the cpu class, and sizes the step's requests from the machine
# type. You do not select a class in your pipeline.
computeClasses:
  cpu:
    name: "cpu-standard"
    tier: "cpu"
    machineType: "n2-standard-8"
    tolerationKey: "platform.kubecore.io/ml-workload"
    tolerationValue: "cpu"
    maxNodeCount: 4
    diskSizeGb: 50
    description: "n2-standard-8 (8 vCPU, 32 GiB) — CPU pipeline steps (headroom for model-quantization + heavier CPU steps; scale-from-0 so cost only during a step)"
    # allocatable = the CPU and memory a step may request on this class
    # (the machine's capacity less what the system keeps). The render step
    # sizes each step's requests and limits from it.
    allocatable:
      cpu: 7
      memoryGiB: 27
  gpu:
    name: "gpu-t4"
    tier: "gpu"
    machineType: "n1-standard-8"
    tolerationKey: "platform.kubecore.io/ml-workload"
    tolerationValue: "gpu"
    maxNodeCount: 1
    diskSizeGb: 100
    description: "n1-standard-8 + 1x T4 — YOLO training + qat-finetune (8 vCPU so qat cpu:4 request fits under allocatable; scale-from-0)"
    guestAccelerator:
      type: "nvidia-tesla-t4"
      count: 1
    # allocatable = the CPU and memory a step may request on this class
    # (the machine's capacity less what the system keeps). The render step
    # sizes each step's requests and limits from it.
    allocatable:
      cpu: 7
      memoryGiB: 25
  # all = every cpu and gpu class your project's machines offer. The
  # render step lists them as the allowed values of a step's class setting,
  # so you choose from a list instead of typing a name.
  all:
    - name: "cpu-standard"
      tier: "cpu"
      machineType: "n2-standard-8"
      description: "n2-standard-8 (8 vCPU, 32 GiB) — CPU pipeline steps (headroom for model-quantization + heavier CPU steps; scale-from-0 so cost only during a step)"
      allocatable:
        cpu: 7
        memoryGiB: 27
    - name: "kubecorecpu"
      tier: "cpu"
      machineType: "e2-standard-8"
      description: "e2-standard-8 + 200GiB — image builds"
      allocatable:
        cpu: 7
        memoryGiB: 27
    - name: "gpu-t4"
      tier: "gpu"
      machineType: "n1-standard-8"
      description: "n1-standard-8 + 1x T4 — YOLO training + qat-finetune (8 vCPU so qat cpu:4 request fits under allocatable; scale-from-0)"
      guestAccelerator:
        type: "nvidia-tesla-t4"
        count: 1
      allocatable:
        cpu: 7
        memoryGiB: 25
hpc:
  enabled: true
  provider: "meluxina"
  # HPC (Slurm) steps run through the platform: each one renders as a step that
  # holds no credentials of its own. Where the platform does not serve your
  # project on HPC, the HPC twin of a step renders as a step that fails with a message.
  controller: "serve"
  followerImage: "registry.example/kaos-hpc-operator:v0.0.0"
  # account, user, scratch, home and classes describe your project's access to
  # the HPC (Slurm) provider: its account and user, its file layout and the
  # classes available to you. Placeholder shape only.
  account: "PLACEHOLDER-account"
  user: "PLACEHOLDER-user"
  scratch: "/project/scratch/PLACEHOLDER-account"
  home: "/home/users/PLACEHOLDER-user"
  classes:
  - name: meluxina-gpu
    tier: gpu
    partition: gpu
    qos: default
    gpus: 4
    cpus: 128
    memoryGiB: 512
    description: "4x A100-40GB, 2x EPYC 7452, 512 GB"
  - name: meluxina-cpu
    tier: cpu
    partition: cpu
    qos: default
    gpus: 0
    cpus: 128
    memoryGiB: 512
    description: "2x EPYC 7452, 128 cores, 512 GB"
  - name: meluxina-largemem
    tier: cpu
    partition: largemem
    qos: default
    gpus: 0
    cpus: 128
    memoryGiB: 4096
    description: "4 TB"
checkpoints:
  bucket: PLACEHOLDER-bucket
  prefix: main/checkpoints
  # The platform's image of the checkpoint helper (provided for every app).
  helperImage: "registry.example/kaos-hpc-operator:v0.0.0"
serviceAccountName: argo-workflow
