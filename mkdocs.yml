site_name: Hera ML Pipeline Guide
site_description: A friendly, step by step guide to running the YOLO training pipeline
site_author: Novelcore
site_url: https://novelcore.github.io/yolo-pipelines-template/

repo_name: novelcore/yolo-pipelines-template
repo_url: https://github.com/novelcore/yolo-pipelines-template
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox

extra_css:
  - assets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelcore/yolo-pipelines-template

nav:
  - Home: index.md
  - Getting ready:
      - What you need: what-you-need.md
      - What the pipeline does: the-pipeline.md
  - Your data:
      - Upload your dataset: upload-dataset.md
  - Run it:
      - Run the pipeline: run-it.md
      - Where it trains: where-it-trains.md
      - Watch it train: watch-it.md
      - Read your results: results.md
      - Promote a model: promote.md
  - Help:
      - When something breaks: troubleshooting.md
      - Word list: glossary.md

copyright: "Copyright &copy; 2026 Novelcore"
