site_name: yolo Pipeline Guide
site_description: Train, compare and pick YOLO pose models on KAOS with the yolo community pipeline
site_author: Novelcore
site_url: https://novelcore.github.io/yolo-pipelines-template/

repo_name: novelcore/yolo-pipelines-template
repo_url: https://github.com/novelcore/yolo-pipelines-template
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox

extra_css:
  - assets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelcore/yolo-pipelines-template

nav:
  - Start here: index.md
  - The journey:
      - "1. Prepare and upload a dataset": prepare-dataset.md
      - "2. Release a version and pick it": release-a-version.md
      - "3. Create a yolo pipeline": create-pipeline.md
      - "4. Run, small then full": run-small-and-full.md
      - "5. Results, weights and models": results.md
      - "6. Use a shared dataset": shared-dataset.md
      - "7. Run on HPC (Slurm)": slurm.md
      - A day with yolo: worked-day.md
  - More on the pipeline:
      - What the pipeline does: the-pipeline.md
      - Watch it train: watch-it.md
      - Promote a model: promote.md
      - Datasets: datasets.md
      - All the run-form fields: parameters.md
      - Under the hood (optional): datasets-in-the-steps.md
  - Help:
      - When something breaks: troubleshooting.md
      - Word list: glossary.md
  - kaos-lib guide:   # what is true for every pipeline is explained once, there
      - Datasets: https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/datasets.html
      - Check your pipeline: https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/lint.html
      - Run a step locally: https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/step-run.html
      - Long runs and checkpoints: https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/checkpoint.html
      - Versions and upgrades: https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/support-window.html
      - Everything else: https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/index.html
  - Cookbook (hera): https://novelcore.github.io/hera-pipeline-template/

copyright: "Copyright &copy; 2026 Novelcore"
